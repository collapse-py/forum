<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      站名佔位符由後端在送出時換成設定檔的值（backend/forum/httpapi/site.go，
      對應 FORUM_NAME / FORUM_SHORT_NAME）。前端 src/site.ts 在模組層讀下面這
      兩個 meta 標記，因此第一次繪製就是正確站名，不會先畫出預設值再換掉。
      佔位符必須留在樣式區塊之外：各頁的內嵌樣式是被 CSP 以 SHA-256 授權的，
      區塊內容只要一個位元組不同，整頁就會沒有版面。這段註解因此刻意不寫出
      樣式標籤本身 —— 雜湊是純文字掃描，註解裡出現標籤字面量會被當成開標籤。
    -->
    <meta name="forum-name" content="{{FORUM_NAME}}" />
    <meta name="forum-short-name" content="{{FORUM_SHORT_NAME}}" />
    <title>{{FORUM_NAME}}</title>
    <link rel="stylesheet" href="/style.css?v=202609272345" />
    <link rel="manifest" href="/forum-manifest.json?v=202609190349" />
    <link rel="icon" href="/asset/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/asset/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * 首頁（/forum）樣式
       *
       * 共用層在 /style.css：公開頁殼層（導覽列、底部導覽、膠囊按鈕）、後臺
       * design tokens，以及貼文卡與留言串（/forum 與 /forum/following 兩頁都用
       * PostCard，因此那些規則必須是共用的）。
       *
       * 本區塊只放首頁自己渲染的東西 —— 搜尋藥丸。
       *
       * html:root 必須在這裡重新宣告：--line 與 --accent 兩邊同名不同值。
       * 寫成 html:root 而不是 :root，是為了用多一個元素選擇器贏過 style.css
       * 第 4 節的 :root —— Vite 建置時會把 <link> 移到 <head> 最後，因此不能
       * 靠「<style> 在 <link> 之後」取勝。理由見 style.css 的檔頭說明。
       */
      html:root {
        --bg: #fff;
        --line: #e7e7e7;
        --text: #101010;
        --muted: #777;
        --accent: #111;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        color: var(--text);
        background: var(--bg);
        font-family: Inter, "Noto Sans TC", sans-serif;
      }

      /* .eyebrow 兩套設計系統同名不同義，因此不放在 style.css。 */
      .eyebrow {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      /* --- 搜尋藥丸 ---------------------------------------------------------
       * 搜尋欄的 form 只負責排版（寬度撐滿插槽），視覺主體是下面那顆藥丸。
       *
       * 放大鏡、輸入框、搜尋與取消鈕都在同一顆圓角框內（split pill）。這樣做
       * 是為了「置中」這件事：若按鈕在框外，那一組的中心雖然在導覽列正中央，
       * 輸入框本身仍會因為右側那顆按鈕而偏左約 32px。把按鈕收進框內後，整顆
       * 藥丸就是置中的唯一物件，而它佔掉整列 420px 裡的大部分，視覺上自然讀成
       * 「置中的搜尋框」。
       *
       * 聚焦樣式掛在框上（:focus-within）而不是輸入框上 —— 輸入框已經沒有自己的
       * 邊框，只是一塊透明區域，邊框屬於藥丸。
       * ------------------------------------------------------------------ */
      .search-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      .search-field {
        display: flex;
        flex: 1;
        align-items: center;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding-inline-start: 13px;
        background: #fff;
      }

      .search-field:focus-within {
        border-color: var(--accent);
      }

      .search-field__icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        color: var(--muted);
      }

      .search-field:focus-within .search-field__icon {
        color: var(--text);
      }

      .search-input {
        width: 100%;
        min-width: 0;
        flex: 1;
        border: 0;
        border-radius: 999px;
        padding: 9px 8px;
        color: var(--text);
        background: transparent;
        font: inherit;
        font-size: 14px;
        outline: none;
      }

      /* 藥丸右端的動作鈕。margin 3px 讓它浮在框線內側，圓角與藥丸一致，
         看起來是同一顆控制器的分段，而不是另一顆獨立按鈕。 */
      .search-go {
        flex: 0 0 auto;
        margin: 3px;
        border: 0;
        border-radius: 999px;
        padding: 6px 14px;
        color: #fff;
        background: var(--accent);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .search-go--quiet {
        color: var(--muted);
        background: transparent;
      }

      .search-go--quiet:hover {
        color: var(--text);
      }

      /* type="search" 在 Chromium 會自帶一個清除鈕，而藥丸右端已經有「取消」分段，
         原生鈕會疊在輸入框右側壓到文字；拿掉後清除路徑只剩一條。 */
      .search-input::-webkit-search-cancel-button {
        display: none;
      }
    </style>
  </head>
  <body>
    <!--
      整頁由 src/entries/forum.tsx 掛載。這裡不保留任何靜態骨架：
      React 第一次 render 就會把整棵樹畫進來，任何預先寫死的標記都會在
      掛載時被丟掉，反而造成一次無謂的重排。CSP 的 script-src 'self' 沒有
      'unsafe-inline'，因此掛載必須由外部模組完成，React 就是那個模組。
      上方的 <style> 則是靠 style-src 內的 sha256 授權，見
      backend/forum/httpapi/securityheaders.go。
    -->
    <div id="root"></div>
    <script type="module" src="/src/entries/forum.tsx"></script>
  </body>
</html>
