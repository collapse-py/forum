<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      站名佔位符由後端在送出時換成設定檔的值（backend/forum/httpapi/site.go，
      對應 FORUM_NAME / FORUM_SHORT_NAME）。前端 src/site.ts 在模組層讀下面這
      兩個 meta 標記，因此第一次繪製就是正確站名，不會先畫出預設值再換掉。
      佔位符必須留在樣式區塊之外：各頁的內嵌樣式是被 CSP 以 SHA-256 授權的，
      區塊內容只要一個位元組不同，整頁就會沒有版面。這段註解因此刻意不寫出
      樣式標籤本身 —— 雜湊是純文字掃描，註解裡出現標籤字面量會被當成開標籤。
    -->
    <meta name="forum-name" content="{{FORUM_NAME}}" />
    <meta name="forum-short-name" content="{{FORUM_SHORT_NAME}}" />
    <title>追蹤｜{{FORUM_NAME}}</title>
    <link rel="stylesheet" href="/style.css?v=202609272345" />
    <link rel="manifest" href="/forum-manifest.json?v=202609190349" />
    <link rel="icon" href="/asset/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/asset/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * 追蹤（/forum/following）樣式
       *
       * 共用層在 /style.css：公開頁殼層、貼文卡與留言串（第 3 節 —— 這一頁
       * 與 /forum 渲染同一支 PostCard，因此那些規則必須是共用的）與後臺
       * design tokens。本區塊只放這一頁自己渲染的東西：追蹤中的人清單。
       *
       * html:root 必須在這裡重新宣告：--line 與 --accent 兩邊同名不同值。
       * 寫成 html:root 而不是 :root，是為了用多一個元素選擇器贏過 style.css
       * 第 4 節的 :root —— Vite 建置時會把 <link> 移到 <head> 最後，因此不能
       * 靠「<style> 在 <link> 之後」取勝。理由見 style.css 的檔頭說明。
       */
      html:root {
        --bg: #fff;
        --line: #e7e7e7;
        --text: #101010;
        --muted: #777;
        --accent: #111;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        color: var(--text);
        background: var(--bg);
        font-family: Inter, "Noto Sans TC", sans-serif;
      }

      /* .eyebrow 兩套設計系統同名不同義，因此不放在 style.css。 */
      .eyebrow {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      /* --- 追蹤中的人 -------------------------------------------------------
       * 一列就是一個人：頭像與名稱是同一個連結、時間說明是什麼時候追蹤的，
       * 右邊是取消追蹤。時間用 <time> 的 datetime 屬性存機器可讀的值，
       * 顯示文字則由 formatDateTime 依目前語言格式化（見 core.ts）。
       *
       * 頭像直接沿用 style.css 共用的 .avatar（40px 圓、白字深底），與貼文卡
       * 上的是同一顆，因此不另外定義外觀。
       * ------------------------------------------------------------------ */
      .following-people {
        margin: 0 0 28px;
        padding: 0;
        list-style: none;
      }

      .following-person {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }

      /* 頭像與名稱包在同一個 <a> 裡，而不是各自一個連結（同貼文卡的作法）。
       * 理由：兩個連結指向同一個目的地會讓鍵盤使用者在一列裡按兩次 Tab
       * 才走得到取消追蹤。一個連結給一列，Tab 順序就是「這個人 → 取消追蹤」，
       * 與畫面上看到的可點範圍一致。
       * min-width: 0 讓這欄可以收縮，否則過長的名稱會把時間與按鈕擠出列外。 */
      .following-person__link {
        display: flex;
        align-items: center;
        min-width: 0;
        flex: 1;
        gap: 10px;
        color: var(--text);
        text-decoration: none;
      }

      .following-person__name {
        min-width: 0;
        overflow: hidden;
        font-size: 14px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .following-person__link:hover .following-person__name {
        text-decoration: underline;
      }

      /* 時間與按鈕各自固定寬度：名稱過長時省略而不是把它們擠到下一行
         （.following-person 沒有 flex-wrap）。 */
      .following-person__time {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
      }

      .following-section-title {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <!-- 見 forum.html：整頁由 src/entries/forum-following.tsx 掛載。 -->
    <div id="root"></div>
    <script type="module" src="/src/entries/forum-following.tsx"></script>
  </body>
</html>
