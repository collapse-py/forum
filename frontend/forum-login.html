<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      站名佔位符由後端在送出時換成設定檔的值（backend/forum/httpapi/site.go，
      對應 FORUM_NAME / FORUM_SHORT_NAME）。前端 src/site.ts 在模組層讀下面這
      兩個 meta 標記，因此第一次繪製就是正確站名，不會先畫出預設值再換掉。
      佔位符必須留在樣式區塊之外：各頁的內嵌樣式是被 CSP 以 SHA-256 授權的，
      區塊內容只要一個位元組不同，整頁就會沒有版面。這段註解因此刻意不寫出
      樣式標籤本身 —— 雜湊是純文字掃描，註解裡出現標籤字面量會被當成開標籤。
    -->
    <meta name="forum-name" content="{{FORUM_NAME}}" />
    <meta name="forum-short-name" content="{{FORUM_SHORT_NAME}}" />
    <title>登入｜{{FORUM_NAME}}</title>
    <link rel="stylesheet" href="/style.css?v=202610091755" />
    <link rel="manifest" href="/forum-manifest.json?v=202609190349" />
    <link rel="icon" href="/asset/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/asset/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * 登入閘門（/forum/login）樣式
       *
       * 共用層在 /style.css：公開頁殼層（導覽列、膠囊按鈕、頁尾）與後臺
       * design tokens。本區塊只放這一頁自己渲染的閘門面板與 Google 登入鈕。
       *
       * html:root 必須在這裡重新宣告：--line 與 --accent 兩邊同名不同值。
       * 寫成 html:root 而不是 :root，是為了用多一個元素選擇器贏過 style.css
       * 第 4 節的 :root —— Vite 建置時會把 <link> 移到 <head> 最後，因此不能
       * 靠「<style> 在 <link> 之後」取勝。理由見 style.css 的檔頭說明。
       */
      html:root {
        --bg: #fff;
        --line: #e7e7e7;
        --text: #101010;
        --muted: #777;
        --accent: #111;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        color: var(--text);
        background: var(--bg);
        font-family: Inter, "Noto Sans TC", sans-serif;
      }

      /* .eyebrow 與 .google-btn 兩套設計系統同名不同義，因此不放在 style.css。 */
      .eyebrow {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      .login-gate-main {
        padding: 56px 16px 100px;
      }

      .login-gate-panel {
        max-width: 520px;
        margin: 0 auto;
        padding: 32px 20px 28px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fafafa;
        text-align: center;
      }

      .login-gate-avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 50%;
        color: #fff;
        background: #111;
        font-size: 26px;
        font-weight: 800;
      }

      .login-gate-panel .eyebrow {
        margin-bottom: 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
      }

      .login-gate-panel h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.7rem);
        letter-spacing: -0.06em;
      }

      .login-gate-panel p {
        max-width: 420px;
        margin: 16px auto 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .login-gate-actions {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
      }

      .login-gate-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 200px;
        text-decoration: none;
      }

      .login-gate-install {
        min-width: 200px;
      }

      /* 主要行動按鈕。深色膠囊，與公開頁既有的 .login-link 一致。 */
      .google-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        padding: 12px 20px;
        color: #fff;
        background: var(--accent);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.12);
        font: inherit;
        font-size: 14px;
        font-weight: 700;
      }

      .google-btn:hover {
        border-color: #000;
        background: #000;
      }

      .google-btn__mark {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 50%;
        color: var(--accent);
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 800;
      }

      /*
       * 「返回上一頁」在 <main> 之外，而 .forum-shell 沒有橫向內距，鈕要自己
       * 有一個置中的容器 —— 否則它會貼在視口左緣，和下方置中的頁尾不對稱。
       * 橫向內距沿用其他公開頁殼層的 16px（行動版不會被邊緣切到）。
       */
      .login-gate-back {
        padding: 0 16px;
        text-align: center;
      }

      /*
       * 「返回上一頁」是 <button> 而非 <a>，因此必須自己把 UA 預設的灰底與
       * 框線清掉 —— 否則 .back-link 的排版會疊在一塊系統按鈕上。
       */
      .back-link.plain-link {
        margin: 0;
        border: 0;
        color: var(--muted);
        background: none;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .back-link.plain-link:hover {
        color: var(--text);
      }

      @media (max-width: 640px) {
        .login-gate-main {
          padding-top: 36px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 見 forum.html：整頁由 src/entries/forum-login.tsx 掛載。 -->
    <div id="root"></div>
    <script type="module" src="/src/entries/forum-login.tsx"></script>
  </body>
</html>
