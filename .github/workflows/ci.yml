# CI 閘門。
#
# 這個檔的存在理由只有一句：這個專案的不變條件目前靠紀律維持，而紀律的上限是
# 「有人記得看」。沒有任何自動化閘門的狀態下，加功能等於擴大一個沒有人會自動
# 檢查的面 —— 詳見 ROADMAP.md 的「為什麼是這個順序」。
#
# 三個 job 的取捨：
#   backend / files_server  是兩個獨立的 Go 模組。刻意不合併：它們的 go.mod
#                           與相依完全不同，合在一個 job 裡會讓其中一個壞掉時
#                           難以判斷是哪一邊的問題。
#   frontend                這個專案的 lint 就是型別檢查（strict +
#                           noUncheckedIndexedAccess + exactOptionalPropertyTypes），
#                           而 npm run build 內含 typecheck，因此不必另開 lint job。
#
# 刻意不做的事：
#   - 不設一個「越高越好」的覆蓋率目標。地板的作用是防止退化，不是製造動機：
#     2026-10-21 起地板是 75.0%（合併後實測 87.6%），而且是**逐套件**量的 ——
#     每一個套件都要 ≥ 75.0%。這個數字不是為了「看起來好」，而是因為
#     「一個套件的測試被掏空」在總覆蓋率上看不出來，而那正是會出事的地方。
#     超過地板之後要往上推，必須先有新的測試，而不是先改常數。
#   - 不跑 E2E。Phase 3.1 的遷移測試已經需要真實 MySQL，而 CI 已經是容器裡，
#     用 services: 區塊提供 MySQL 比在測試程式裡起容器更簡單也更可靠。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一個分支連續推送時取消舊的那次：省下排隊時間，且結果與最新一次推送相同。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (build / vet / test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 固定到 1.26.x 而不是浮動的 stable：兩條 build 指令需要不同版本的 go.mod
      # 是本專案過去的持續地雷（Phase 0.2 已統一），而 CI 是唯一會自動發現
      # 「設定檔要求的版本比工具鏈舊」的地方。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      # CGO 開啟是為了 race detector（Phase 1.2）。成本是這一個 apt line，
      # 收益是把「這個專案沒有資料競爭」從靜態審查結論變成實證 —— 這個專案
      # 大量依賴 goroutine 與記憶體共享（metrics.Registry 的 mutex + atomics、
      # 三個 RateLimiter、probeDependencies 的三個並行探測、beginAdminTx 邊界的
      # defer tx.Rollback()），而 CODE_REVIEW.md 明寫那個結論未經實證。
      - name: 安裝 C 編譯器（race detector 需要）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # -race 的測試必須真的跑了東西。coverageprofile 的存在就是為了這一點：
      # 若某個套件完全沒有測試，它不會出現在 profile 裡，因此下面用
      # coverage-floor 那個 job 來確保「有測試的套件沒有消失」。
      - name: test -race
        run: go test ./... -race -covermode=count -coverprofile=coverage.out

      # 逐套件的覆蓋率地板（每個套件都要 ≥ 75.0%）。
      #
      # 與 coverage-floor job 的「總數」是兩道不同的閘門：總數過關但某個
      # 套件被掏空，那種退化在總覆蓋率上看不出來 —— 而被掏空的那個套件正是
      # 壞掉時爆炸半徑最大的那個。因此這裡逐套件量一次。
      #
      # 2026-10-21 實測：最低的是 metrics 76.9% 與 httpapi 87.0%，其餘都在
      # 88% 以上（logcaller 沒有敘述，不在此列）。
      - name: 檢查逐套件覆蓋率地板
        run: go run ./tools/coveragefloor coverage.out 75.0 --per-package

      - name: 上傳覆蓋率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: warn

  files_server:
    name: files_server (build / vet / test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: files_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: 安裝 C 編譯器（race detector 需要）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # 這個模組過去是 0% 覆蓋（Phase 3.4 才補上測試）。留著 -race 是因為
      # 它現在有了 upload 與 delete 兩條會碰磁碟的路徑，以及一個 Redis 用戶端。
      - name: test -race
        run: go test ./... -race -covermode=count -coverprofile=coverage.out

      # 逐套件地板與 backend 相同（75.0%）。這個模組只有一個套件，因此這道
      # 閘門與總數是同一件事；它存在的原因是「兩個模組用同一條線」，而不是
      # 這個模組需要另一個數字。
      #
      # 工具在 backend 模組裡（那是它唯一的位置），因此這一步的工作目錄是
      # backend，而被檢查的 profile 在 ../files_server。
      - name: 檢查逐套件覆蓋率地板
        working-directory: backend
        run: go run ./tools/coveragefloor ../files_server/coverage.out 75.0 --per-package

      - name: 上傳覆蓋率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-server-coverage
          path: files_server/coverage.out
          if-no-files-found: warn

  frontend:
    name: frontend (typecheck / build / i18n)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 而不是 npm install：前者依 package-lock.json 建置，會在 lock 與
      # package.json 不同步時直接失敗。後者會靜默更新 lock，讓「建置結果與
      # 上次不同」這件事沒有任何訊號。
      - name: 安裝相依
        run: npm ci

      # 這個專案最好的設計之一：i18n 完整性已經在編譯期由 Record<MessageKey, string>
      # 強制 —— typecheck 通過即代表沒有任何語系漏 key，也沒有任何元件用了不存在的
      # key。因此型別檢查是 i18n 檢查的一部分，不是兩件事。
      - name: typecheck
        run: npm run typecheck

      # build 內含 typecheck，重跑一次是刻意的：Vite 的 HTML 轉換與混淆插件
      # 只在 build 時才會執行，而它們正是「CSP style hash 授權失效」與
      # 「service-worker.js 位置被改掉」這兩類只在 build 產物裡才會出現的問題
      # 的發生點。
      - name: build
        run: npm run build

      # verify-catalogs 檢查 build 之外的事：未翻譯殘留、佔位符一致性，以及
      # README 宣稱的語系數量與清單是否與目錄實際內容相符。這三件事都不會
      # 讓編譯失敗，但每一件都是「文件與實作漂移」或「翻譯壞掉」的第一個徵兆。
      - name: 驗證翻譯目錄與 README 語系宣稱
        run: node ../tools/i18n/verify-catalogs.mjs

      # 產出的每個 HTML 殼都必須與後端的 CSP 授權清單同步（Phase 2.4 的
      # 不變條件三處之一）。把 dist/ 當成附件上傳，是為了讓「後端的
      # frontendShellFiles 少了一個」這種錯誤在前端 job 裡就看得出來。
      - name: 上傳建置產物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  coverage-floor:
    name: coverage floor
    runs-on: ubuntu-latest
    needs: [backend, files_server]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - uses: actions/download-artifact@v4
        with:
          path: coverage
          pattern: '*-coverage'
          merge-multiple: true

      # 地板從 75.0 起算（2026-10-21 實測合併後 87.7%，留 12.7 個百分點的餘裕）。
      #
      # 實測值的組成：backend 87.4%（httpapi 87.0%、data 98.6%、purge 93.5%、
      # audit 97.0%、metrics 76.9%、main 78.5%，其餘皆 ≥ 88%）+
      # files_server 91.6%，合併 87.7%。
      #
      # 這個數字與逐套件的地板（75.0，見 backend 與 files_server 兩個 job）是
      # 兩道不同的閘門：這裡量的是「合併後的總數」，那裡量的是「每個套件
      # 各自」。兩者都擋同一種退化 —— 覆蓋率掉下來 —— 但擋的不是同一種：
      # 總數看不見「某個套件被掏空」。
      #
      # 這個數字不含 migrations job 的覆蓋率（那個 job 有獨立 MySQL，
      # 產出的 profile 刻意不合併 —— 否則「有 MySQL 與沒有 MySQL」兩種情況
      # 會讓這道閘門的意義取決於跑在哪裡）。
      #
      # 刻意只在這裡用總數而不逐套件：逐套件會讓「把一個套件的測試搬去補
      # 另一個套件」變成一種合法的玩法 —— 總數不變，但那個套件的保護消失了。
      # 因此逐套件的那道閘門放在各模組自己的 job 裡（profile 不跨模組合併，
      # 套件名稱不會互相蓋掉）。
      - name: 檢查覆蓋率地板
        run: go run ./tools/coveragefloor coverage/coverage.out 75.0

  invariants:
    name: invariants (audit / admin auth / blocklist mount)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      # 分析器是獨立的 Go 模組（它的相依 golang.org/x/tools 不該進 runtime 相依），
      # 因此要先建置成執行檔才能餵給 go vet。
      #
      # 失敗模式是**編譯失敗**而不是「有人沒注意到」—— 這就是把這四條不變條件
      # 從紀律變成工具的全部意義。
      - name: 建置不變條件 analyzer
        working-directory: tools/invariants
        run: go build -o invariants .

      - name: 不變條件 analyzer
        working-directory: backend
        run: go vet -vettool="$(pwd)/../tools/invariants/invariants" ./...

      # 分析器自己也要被測試，而且**必須含負向測試**。這裡曾經有一個 handler
      # 索引寫成「只索引自由函式」，結果全部 24 條後台路由（全是方法）都被靜默
      # 跳過 —— 分析器看起來在跑、CI 全綠，而規則沒有守住任何東西。
      # testdata/src/*/bad 是唯一能抓到這類錯誤的東西（見 analyzer_test.go 的
      # 檔頭）。
      - name: analyzer 自測
        working-directory: tools/invariants
        run: go test ./...

  migrations:
    # 名字裡有冒號（"real MySQL: ..."），必須加引號：YAML 的純量值裡
    # 「冒號 + 空白」會被當成映射，整份 workflow 因此解析失敗。
    name: "migrations (real MySQL: idempotency / restart / upgrade / comment subtree / post purge)"
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      # 8.0.29 是下限不是偏好：ADD COLUMN IF NOT EXISTS 需要它，而那正是
      # MigrateMySQL 裡反覆用到的語法。選這個版本等於讓 CI 持續驗證「下限
      # 版本真的能跑」，否則那個下限只在文件裡成立。
      #
      # 刻意用 services: 而不是 testcontainers：CI 已經在容器裡了，這個區塊
      # 比在測試程式裡起一個容器更簡單也更可靠，而且失敗時診斷容易得多。
      mysql:
        image: mysql:8.0.29
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: forum_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      # go-sqlmock 驗證不了 DDL 真的能執行，miniredis 對 MySQL 沒有對應物 ——
      # 而這正是本 job 存在的理由。測試自己會 CREATE / DROP 一個拋棄式資料庫，
      # 因此連線字串只需要指向伺服器。
      - name: 遷移測試
        env:
          FORUM_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/?parseTime=True&loc=UTC&multiStatements=true'
        run: go test ./forum/data/... -v -timeout 10m

      # 留言子樹刪除（forumCommentSubtreeDelete）：四張 forum_post_comments 別名的
      # 多表 DELETE，而它的失效模式是「每一次留言刪除都 500」。單元測試只能斷言
      # SQL 字串的形狀，因此這個 job 也執行那一組需要真實 MySQL 的測試
      #（comment_reply_mysql_test.go，-run MySQL 選得到）。沒有 DSN 時它們全部
      # skip，所以一般開發者的 go test ./... 與 backend job 都不受影響。
      - name: 留言子樹刪除（真實 MySQL）
        env:
          FORUM_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/?parseTime=True&loc=UTC&multiStatements=true'
        run: go test ./forum/httpapi/... -run MySQL -v -timeout 10m

      # 軟刪除貼文的保留期清理（purge 套件）：清理排程的正確性是「DELETE
      # 之後 SELECT 看不到」，sqlmock 回答不了這個問題，因此需要真實 MySQL。
      - name: 軟刪除貼文清理排程（真實 MySQL）
        env:
          FORUM_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/?parseTime=True&loc=UTC&multiStatements=true'
        run: go test ./forum/purge/... -run MySQL -v -timeout 10m

  secrets:
    name: secrets (config.conf 不得進版控)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 是必要的：要掃整份歷史才抓得到「曾經被提交、
          # 後來才刪掉」的憑證。只掃工作區的話，一個刪掉檔案的 commit 就足以
          # 讓真正的憑證留在倉庫裡。
          fetch-depth: 0

      # .gitignore 擋住 config.conf，而那是**唯一**的防線。一份設定檔含
      # GOOGLE_CLIENT_SECRET、FILES_SERVER_TOKEN、REDIS_PASSWORD 與 DSN 裡的
      # 帳密，被誤提交之後「刪掉檔案」並不會把它從歷史裡移除。
      #
      # 這裡刻意不依賴 gitleaks 之類的外部 action：這個檢查要擋的只有一件事
      # （這兩份設定檔），把它寫成 20 行可讀的 shell 比引入一個 action 更容易
      # 讓維運在告警時知道規則是什麼。
      - name: 確認設定檔從未被追蹤
        run: |
          set -euo pipefail
          status=0
          for path in backend/config/config.conf files_server/config.conf; do
            if git log --all --full-history -- "$path" --quiet | grep -q .; then
              echo "::error::$path 曾經被提交進版控（憑證可能已外洩，必須輪替）"
              status=1
            fi
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path 目前被版控追蹤"
              status=1
            fi
          done
          exit $status

      # 設定檔含明文憑證，因此版控裡只允許去密碼化的 .example 範本。
      # 這一項擋的是「有人把範本裡填上真實 token 後改名成 config.conf 並提交」
      # 這條常見路徑。
      #
      # 為什麼是「逐鍵檢查」而不是「掃所有未加引號的值」：範本裡大部分的
      # 值本來就沒有引號（FORUM_NAME=SB 論壇、SERVER_PORT=:8088），那種規則
      # 會把整份範本判成有問題 —— 等於沒有檢查。憑證鍵則相反：它們的值永遠
      # 是空或一個佔位符（change_me），因此「不是佔位符」是一個明確的訊號。
      #
      # 這一步會先掃真正的範本，再把三組假憑證塞進暫存副本掃第二次，**要求
      # 第二次變紅**。自我測試不是裝飾：前一版（一條 ERE 掃所有未加引號的
      # 值）在 CI 之外沒有任何方式被驗證過，而它其實永遠不會把 status 設成
      # 1 —— 一個沒有被反向測試過的檢查，遲早會變成一個只印訊息的路由。
      - name: 確認範本檔的憑證鍵仍是佔位符
        run: |
          set -euo pipefail
          status=0

          # 佔位符白名單：憑證鍵的值必須是空的，或**恰好**是其中一個字
          #（不分大小寫）。範本換了佔位符字樣而沒有補進這裡，症狀是這一步
          # 變紅（不是放行）—— 這是刻意的方向。
          placeholders='change_me placeholder your_secret your_token your_password todo xxx'

          is_placeholder() {
            [ -z "$1" ] && return 0
            local lower candidate
            lower="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            for candidate in $placeholders; do
              [ "$lower" = "$candidate" ] && return 0
            done
            return 1
          }

          trim_value() {
            # 去掉行尾註解、前後空白與成對的引號（KEY=value／key = "value"）。
            local v="$1"
            v="${v%%#*}"
            v="$(printf '%s' "$v" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$v" in
              \"*\") v="${v#\"}"; v="${v%\"}" ;;
              \'*\') v="${v#\'}"; v="${v%\'}" ;;
            esac
            printf '%s' "$v"
          }

          # check_config 掃一份設定檔；有問題回 1。
          #
          # keys 由呼叫端給，因為兩個模組的鍵名不同（後端大寫的 KEY=value、
          # files_server 的 TOML 用小寫 key = value）。漏列一個鍵的症狀是那個
          # 鍵沒有被檢查（不是誤報），因此鍵清單與範本要一起維護。
          backend_keys='FILES_SERVER_TOKEN REDIS_PASSWORD DB_DSN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET ES_USERNAME ES_PASSWORD ES_API_KEY'
          files_keys='token password access_key secret_key'

          check_config() {
            local path="$1" keys="$2" key line value secret bad=0
            for key in $keys; do
              # 取最後一次出現：同一個鍵應該只有一種定義，而最後一次就是
              # 會生效的那一個（前面的是註解裡的範例或舊值）。
              line="$(grep -E "^[[:space:]]*${key}[[:space:]]*=" "$path" | tail -n 1 || true)"
              [ -n "$line" ] || continue
              value="$(trim_value "${line#*=}")"
              case "$key" in
                DB_DSN)
                  # DSN 是複合值（"帳號:密碼@tcp(…)…"），只有密碼段是憑證。
                  secret="${value%%@*}"     # 第一個 @ 之前
                  secret="${secret#*:}"     # 第一個 : 之後
                  ;;
                *)
                  secret="$value"
                  ;;
              esac
              is_placeholder "$secret" && continue
              echo "::error::$path 的 $key 不是已知的佔位符（允許空值或 ${placeholders} 之一）：疑似明文憑證"
              bad=1
            done
            return $bad
          }

          check_config backend/config/config.conf.example "$backend_keys" || status=1
          check_config files_server/config.conf.example "$files_keys" || status=1

          # 自我測試（負向）：三個變異各自對應一種「真的憑證」的形狀，任何
          # 一個沒有被擋下都代表這道檢查有缺口。
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp backend/config/config.conf.example "$tmp/filled.conf"
          cp backend/config/config.conf.example "$tmp/dsn.conf"
          cp files_server/config.conf.example "$tmp/toml.conf"
          # 1) 空著的憑證鍵被填上 —— 最常見的誤提交路徑。
          printf 'GOOGLE_CLIENT_SECRET=AIzaSyFAKEfakeFAKEfakeFAKE\n' >> "$tmp/filled.conf"
          # 2) DSN 的密碼段（複合值，判定方式與其他鍵不同）。
          printf 'DB_DSN=forum:Str0ngP4ssw0rd@tcp(127.0.0.1:3306)/forum\n' >> "$tmp/dsn.conf"
          # 3) files_server 的 TOML 值（既有佔位符被換成看起來像真的 token）。
          sed 's/"change_me"/"sk-live-fake-token-9f3a"/' "$tmp/toml.conf" > "$tmp/toml.mod.conf"

          expect_blocked() {
            if check_config "$1" "$2"; then
              echo "::error::自我測試失敗：$(basename "$1") 帶著假憑證卻仍然通過（這道檢查有缺口）"
              status=1
            fi
          }
          expect_blocked "$tmp/filled.conf" "$backend_keys"
          expect_blocked "$tmp/dsn.conf" "$backend_keys"
          expect_blocked "$tmp/toml.mod.conf" "$files_keys"
          exit $status